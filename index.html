<!DOCTYPE html>

<head>

<title>BourseMonde</title>

<meta name="theme-color" content="#0f6e56">

<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2320;--mu:#5f6b66;--ac:#0f6e56;--bd:#e1e0d8;--chip:#e6f2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--card:#1f2522;--tx:#eceee9;--mu:#9aa6a0;--ac:#4fc4a3;--bd:#2e3632;--chip:#25352f}}
:root[data-theme="dark"]{--bg:#161a18;--card:#1f2522;--tx:#eceee9;--mu:#9aa6a0;--ac:#4fc4a3;--bd:#2e3632;--chip:#25352f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:24px}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.tabs button{flex:none;padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.c h2{margin:0;font-size:17px}.c .p{color:var(--mu);font-size:14px;margin:2px 0 8px}
.s{font-weight:600;color:var(--ac);margin-bottom:8px}
.g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.g span{background:var(--chip);border-radius:8px;padding:3px 9px;font-size:13px}
a.b{display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;padding:11px;border-radius:10px;font-weight:600}
.n{color:var(--mu);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="w">
<h1>🎓 BourseMonde</h1>
<p class="sub">Bourses d’études par destination · données vérifiées le 23/10/2026</p>
<input id="q" placeholder="Rechercher une université, un pays, un niveau…">
<div class="tabs" id="t"></div>
<div id="l"></div>
<p class="n"><a href="privacy.html" style="color:inherit">Politique de confidentialité</a></p>
<p class="n">Les montants, conditions et dates limites changent chaque année : vérifie toujours sur le site officiel de l’université avant de postuler.</p>
</div>

function tabs(){T.innerHTML="";R.forEach(function(r){var b=document.createElement("button");b.textContent=r;if(r===cur)b.className="on";b.onclick=function(){cur=r;tabs();show()};T.appendChild(b)})}
function show(){var s=q.value.toLowerCase(),h="";
D.forEach(function(d){if(cur!=="Tout"&&d[2]!==cur)return;if(s&&d.join(" ").toLowerCase().indexOf(s)<0)return;
h+='<div class="c"><h2>'+d[0]+'</h2><div class="p">'+d[1]+'</div><div class="s">'+d[4]+'</div><div class="g"><span>🎓 '+d[5]+'</span><span>💰 '+d[6]+'</span><span>🗣 '+d[7]+'</span><span>📅 '+d[8]+'</span></div><a class="b" href="'+d[3]+'" target="_blank" rel="noopener">Site officiel de l’université</a></div>'});
L.innerHTML=h||'<p class="sub">Aucun résultat.</p>'}
